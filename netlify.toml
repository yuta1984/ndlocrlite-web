[build]
  publish = "dist"
  command = "npm run build"

# SharedArrayBufferに必要なCOOP/COEPヘッダーを全リクエストに付与
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://huggingface.co https://*.huggingface.co https://www.google-analytics.com https://www.googletagmanager.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:"

# SPAフォールバック
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
